<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Lie 🤥</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #bfc9d9;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 16px;
            color: #dce6f5;
        }

        .statement {
            background: white;
            color: #18202c;
            padding: 20px;
            border-radius: 16px;
            margin: 12px 0;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            border: 3px solid transparent;
        }

        .statement:hover {
            transform: translateY(-3px);
            border-color: #7c5cff;
        }

        .statement.correct {
            border-color: #22c55e;
            background: #dcfce7;
        }

        .statement.wrong {
            border-color: #ef4444;
            background: #fee2e2;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .play-btn,
        .next-btn {
            background: #7c5cff;
            color: white;
            padding: 16px 35px;
            border-radius: 14px;
            font-size: 18px;
            margin-top: 15px;
            transition: 0.2s;
        }

        .play-btn:hover,
        .next-btn:hover {
            transform: scale(1.04);
        }

        .hidden {
            display: none;
        }

        .result {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0 10px;
        }

        .explanation {
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .score {
            font-size: 18px;
            margin-top: 15px;
        }

        .streak {
            color: #facc15;
        }

        .home-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="game">

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="card">

        <div class="home-icon">🤥</div>

        <h1>Guess The Lie</h1>

        <p class="subtitle">
            Three statements. One lie.<br>
            Can you find it?
        </p>

        <button class="play-btn" onclick="startGame()">
            ▶ PLAY GAME
        </button>

        <div class="score">
            🏆 High Score: <span id="highScore">0</span>
        </div>

    </div>


    <!-- GAME SCREEN -->
    <div id="gameScreen" class="card hidden">

        <div class="top-bar">
            <span>Question <span id="questionNumber">1</span></span>
            <span>🏆 <span id="score">0</span></span>
        </div>

        <h2>🤔 Which statement is the lie?</h2>

        <div id="statements"></div>

        <div id="result" class="result"></div>

        <div id="explanation" class="explanation"></div>

        <button id="nextButton" class="next-btn hidden" onclick="nextQuestion()">
            NEXT →
        </button>

        <div class="score">
            🔥 Streak: <span id="streak" class="streak">0</span>
        </div>

    </div>

</div>


<script>

const questions = [

    {
        statements: [
            "I have eaten pizza with deepzz.",
            "I can solve a Rubik's cube.",
            "I have watched a movie this week."
        ],
        lie: 0,
        explanation: "The lie was the first statement!"
    },

    {
        statements: [
            "She loves chocolate.",
            "She love MVIT more than hoysala.",
            "She is more fooddyyy than me."
        ],
        lie: 1,
        explanation: "The people in hoysala were more loyal, She loves Hoysala !"
    },

    {
        statements: [
            
            "She will sleep suddenly after having food.",
            "She will sleep at 11.30.",
            "She will come online at exact 10pm after having food and completing work."
        ],
        lie: 0,
        explanation: "nope, she have some duties to complete !"
    },

    {
        statements: [
            "Her father from Mysore .",
            "She obeys the suggetions given by relatives.",
            "Her reels partner cousin is age of 24."
        ],
        lie: 1,
        explanation: "Noo Waysss."
    },

    {
        statements: [
            "M2 marks=71.",
            "IOT marks=75.",
            "Kannada marks=77."
        ],
        lie: 0,
        explanation: "M2 marks=78!"
    }

];

let currentQuestion = 0;
let score = 0;
let streak = 0;
let answered = false;

const highScoreElement = document.getElementById("highScore");

let highScore = localStorage.getItem("highScore") || 0;
highScoreElement.textContent = highScore;


function startGame() {

    currentQuestion = 0;
    score = 0;
    streak = 0;
    answered = false;

    document.getElementById("homeScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");

    loadQuestion();
}


function loadQuestion() {

    answered = false;

    const question = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

    document.getElementById("score").textContent = score;

    document.getElementById("streak").textContent = streak;

    document.getElementById("result").textContent = "";

    document.getElementById("explanation").textContent = "";

    document.getElementById("nextButton").classList.add("hidden");

    const container = document.getElementById("statements");

    container.innerHTML = "";

    question.statements.forEach((statement, index) => {

        const div = document.createElement("div");

        div.className = "statement";

        div.textContent = statement;

        div.onclick = function() {
            checkAnswer(index, div);
        };

        container.appendChild(div);

    });
}


function checkAnswer(selected, selectedElement) {

    if (answered) return;

    answered = true;

    const question = questions[currentQuestion];

    const allStatements =
        document.querySelectorAll(".statement");

    if (selected === question.lie) {

        selectedElement.classList.add("correct");

        score += 100;

        streak++;

        document.getElementById("result").textContent =
            "🎉 CORRECT!";

        document.getElementById("result").style.color =
            "#22c55e";

    } else {

        selectedElement.classList.add("wrong");

        allStatements[question.lie].classList.add("correct");

        streak = 0;

        document.getElementById("result").textContent =
            "❌ WRONG!";

        document.getElementById("result").style.color =
            "#ef4444";
    }

    document.getElementById("score").textContent = score;

    document.getElementById("streak").textContent = streak;

    document.getElementById("explanation").textContent =
        question.explanation;

    document.getElementById("nextButton").classList.remove("hidden");

    updateHighScore();
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        currentQuestion = 0;

        alert(
            "🎉 Game Complete!\n\nYour Score: " +
            score +
            "\n\n🔥 Streak: " +
            streak
        );

        document.getElementById("gameScreen").classList.add("hidden");
        document.getElementById("homeScreen").classList.remove("hidden");

        return;
    }

    loadQuestion();
}


function updateHighScore() {

    if (score > highScore) {

        highScore = score;

        localStorage.setItem("highScore", highScore);

        document.getElementById("highScore").textContent =
            highScore;
    }
}

</script>

</body>
</html>
